# =============================================================================
# DRPS stack - SpiderFoot + Tor + (optionnel: LACUS via build local)
#
# AIL Framework n'est PAS inclus ici : son installation requiert kvrocks +
# plusieurs services Python en parallele, peu adapte a un simple compose.
# Deployer AIL sur une VM dediee en suivant l'install officielle :
#   https://github.com/ail-project/ail-framework/blob/master/HOWTO.md
# Puis renseigner AIL_URL et AIL_API_KEY dans .env.
#
# Use with: docker compose -f docker-compose.yml -f docker-compose.drps.yml up -d
# =============================================================================

name: digital_printing

volumes:
  spiderfoot_data:
  lacus_redis_data:
  tor_data:

services:

  # ---------------------------------------------------------------------------
  # SpiderFoot - OSINT & EASM (web UI + API)
  # Build from source : pas d'image officielle reliable sur les registries
  # ---------------------------------------------------------------------------
  spiderfoot:
    image: digital_printing/spiderfoot:latest
    build:
      context: ./services/spiderfoot
    restart: unless-stopped
    volumes:
      - spiderfoot_data:/home/spiderfoot/.spiderfoot
    ports:
      - "5001:5001"
    networks:
      - dp_drps
      - dp_core

  # ---------------------------------------------------------------------------
  # Tor proxy (utilise par LACUS pour les .onion)
  # ---------------------------------------------------------------------------
  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - tor_data:/var/lib/tor
    networks:
      - dp_drps
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # LACUS - capturing engine (Playwright + Tor)
  # Build from source : pas d'image officielle publiee
  # ---------------------------------------------------------------------------
  lacus-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - lacus_redis_data:/data
    networks:
      - dp_drps

  lacus:
    image: digital_printing/lacus:latest
    build:
      context: ./services/lacus
    restart: unless-stopped
    depends_on:
      - lacus-redis
      - tor
    environment:
      LACUS_HOME: /lacus
      REDIS_SERVER: lacus-redis
      REDIS_PORT: "6379"
      TOR_PROXY: socks5://tor:9050
    volumes:
      - ./config/lacus/lacus.json:/lacus/config/generic.json:ro
    ports:
      - "7100:7100"
    networks:
      - dp_drps
      - dp_core
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7100/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
