# =============================================================================
# DRPS stack: SpiderFoot, AIL Framework, LACUS, Tor proxy
# Use with: docker compose -f docker-compose.yml -f docker-compose.drps.yml up -d
# =============================================================================

name: digital_printing

volumes:
  spiderfoot_data:
  ail_data:
  lacus_redis_data:
  tor_data:

services:

  # ---------------------------------------------------------------------------
  # SpiderFoot - OSINT & EASM (web UI + API)
  # ---------------------------------------------------------------------------
  spiderfoot:
    image: ghcr.io/smicallef/spiderfoot:latest
    restart: unless-stopped
    environment:
      SPIDERFOOT_USER: ${SPIDERFOOT_USER:-spiderfoot}
      SPIDERFOOT_PASSWORD: ${SPIDERFOOT_PASSWORD:-change_me_sf_password}
    volumes:
      - spiderfoot_data:/home/spiderfoot/.spiderfoot
      - ./config/spiderfoot/spiderfoot.cfg:/home/spiderfoot/.spiderfoot/spiderfoot.cfg:ro
    command: ["-l", "0.0.0.0:5001"]
    ports:
      - "5001:5001"
    networks:
      - dp_drps
      - dp_core

  # ---------------------------------------------------------------------------
  # Tor proxy (utilise par LACUS pour les .onion)
  # ---------------------------------------------------------------------------
  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - tor_data:/var/lib/tor
    networks:
      - dp_drps
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9050 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # LACUS - capturing engine (Playwright + Tor + I2P)
  # https://github.com/ail-project/lacus
  # ---------------------------------------------------------------------------
  lacus-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - lacus_redis_data:/data
    networks:
      - dp_drps

  lacus:
    image: ghcr.io/ail-project/lacus:latest
    restart: unless-stopped
    depends_on:
      - lacus-redis
      - tor
    environment:
      LACUS_HOME: /lacus
      REDIS_SERVER: lacus-redis
      REDIS_PORT: "6379"
      TOR_PROXY: socks5://tor:9050
    volumes:
      - ./config/lacus/lacus.json:/lacus/config/generic.json:ro
    ports:
      - "7100:7100"
    networks:
      - dp_drps
      - dp_core
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7100/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # AIL Framework - analyse des fuites/leaks (paste, social, forums)
  # https://github.com/ail-project/ail-framework
  # ---------------------------------------------------------------------------
  ail:
    image: ghcr.io/ail-project/ail-framework:latest
    restart: unless-stopped
    depends_on:
      - lacus
    environment:
      AIL_HOME: /opt/ail
      AIL_LACUS_URL: http://lacus:7100
      AIL_BIND: 0.0.0.0
    volumes:
      - ail_data:/opt/ail/PASTES
      - ./config/ail/core.cfg:/opt/ail/configs/core.cfg:ro
    ports:
      - "7000:7000"
    networks:
      - dp_drps
      - dp_core
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:7000/ || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 10
      start_period: 180s
